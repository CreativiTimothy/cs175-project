project:
  seed: 42
  output_dir: outputs/weekly_fnn

data:
  path: data/raw/weekly_bars.csv
  processed_rows_path: data/processed/weekly_model_rows.csv
  timeframe: weekly
  symbols: []
  window_size: 100
  feature_set: general_pattern_geometry
  include_volume: true
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  type: fnn
  task: classification
  hidden_sizes: [128, 64, 32]
  dropout: 0.50

training:
  batch_size: 128
  epochs: 80
  learning_rate: 0.0001
  weight_decay: 0.001
  patience: 15
  decision_threshold: 0.50
