project:
  seed: 42
  output_dir: outputs/rich_lstm_seed42

data:
  path: data/raw/daily_bars.csv
  processed_rows_path: data/processed/model_rows_lstm_sequence.csv
  timeframe: daily
  symbols: []
  window_size: 100
  feature_set: general_pattern_geometry
  include_volume: true
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  type: lstm
  task: classification
  projection_size: 24
  hidden_size: 32
  num_layers: 1
  dropout: 0.30

training:
  batch_size: 128
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.001
  patience: 15
  decision_threshold: 0.50
