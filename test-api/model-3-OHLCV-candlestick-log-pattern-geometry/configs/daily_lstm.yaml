project:
  seed: 42
  output_dir: outputs/daily_lstm

data:
  path: data/raw/daily_bars.csv
  processed_rows_path: data/processed/model_rows_lstm.csv
  timeframe: daily
  symbols: []
  window_size: 100
  feature_set: general_pattern_geometry
  include_volume: true
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  type: lstm
  task: classification
  hidden_size: 64
  num_layers: 2
  dropout: 0.20

training:
  batch_size: 256
  epochs: 80
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  decision_threshold: 0.50
