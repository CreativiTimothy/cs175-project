project:
  seed: 42
  output_dir: outputs/daily_fnn

data:
  path: data/raw/daily_bars.csv
  processed_rows_path: data/processed/model_rows.csv
  timeframe: daily
  symbols: []
  window_size: 100
  features: [open, high, low, close]
  include_volume: false
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  type: fnn
  task: classification
  hidden_sizes: [64, 32]
  dropout: 0.50

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.001
  patience: 15
  decision_threshold: 0.50