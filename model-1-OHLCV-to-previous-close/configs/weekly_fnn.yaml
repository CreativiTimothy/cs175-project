project:
  seed: 42
  output_dir: outputs/weekly_fnn

data:
  path: data/raw/weekly_bars.csv
  processed_rows_path: data/processed/weekly_model_rows.csv
  timeframe: weekly
  symbols: []
  window_size: 100
  features: [open, high, low, close]
  include_volume: false
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  type: fnn
  task: classification
  hidden_sizes: [256, 128, 64]
  dropout: 0.30

training:
  batch_size: 128
  epochs: 80
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  decision_threshold: 0.50
